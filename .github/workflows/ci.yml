name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 12 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  IM_PREFIX: ${{ github.workspace }}/.cache/imagemagick
jobs:
  imagemagick:
    name: Prepare ImageMagick
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Compute build identity
        id: key
        env:
          CACHE_BASE: imagemagick-v1-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ hashFiles('scripts/build-imagemagick.sh', 'ci/imagemagick-*-deps.txt') }}
        run: printf 'key=%s-%s\n' "$CACHE_BASE" "${ImageVersion:?}" >> "$GITHUB_OUTPUT"
      - name: Restore or save the compiled installation
        id: cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .cache/imagemagick
          key: ${{ steps.key.outputs.key }}
      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          mapfile -t packages < ci/imagemagick-build-deps.txt
          sudo apt-get install -y --no-install-recommends "${packages[@]}"
      - name: Build pinned ImageMagick once
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-imagemagick.sh "$IM_PREFIX"
      - name: Record cache result
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [[ "$CACHE_HIT" == true ]]; then
            echo 'ImageMagick restored from cache; compilation skipped.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ImageMagick compiled once for both Python jobs; installation cached.' >> "$GITHUB_STEP_SUMMARY"
          fi
  test:
    needs: imagemagick
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@751276eafca55f10f252026015f43c488f2322ba
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime and test dependencies
        run: |
          sudo apt-get update
          mapfile -t packages < ci/imagemagick-runtime-deps.txt
          sudo apt-get install -y --no-install-recommends shellcheck make "${packages[@]}"
      - name: Restore the shared ImageMagick installation
        uses: actions/cache/restore@3edfce9056124e459a23f683a21433670d47daca
        with:
          path: .cache/imagemagick
          key: ${{ needs.imagemagick.outputs.cache-key }}
          fail-on-cache-miss: true
      - name: Use the cached installation
        run: |
          printf '%s\n' "$IM_PREFIX/bin" >> "$GITHUB_PATH"
          printf 'LD_LIBRARY_PATH=%s\n' "$IM_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Verify the dependency
        run: magick -version
      - name: Check code and generated documentation
        run: make check
      - name: Run disposable-fixture tests
        run: |
          set -o pipefail
          make test-all 2>&1 | tee test-results.txt
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-results-${{ matrix.python }}
          path: test-results.txt
          if-no-files-found: warn
